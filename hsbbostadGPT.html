<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>HSB Bostad – kundsupport GPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    :root{
      --hsb-blue-1:#003366;
      --hsb-blue-700:#00264d;
      --hsb-blue-5:#CBE8F1;
      --vh: 1vh;                 /* sätts i JS med visualViewport */
      --radius:16px;
      --user-bg:#f7f7f8;
      --bot-bg:#e8f0fe;
      --error:#b91c1c;
      --error-bg:#ffe6e6;
    }

    *, *::before, *::after { box-sizing:border-box; }
    html, body {
      height: 100%;
      margin: 0; padding: 0;
      overflow: auto;            /* låt sidan få scroll om det behövs */
      background:#fff; color:#0e1012;
      font-family:'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Wrapper fyller skärmen även med tangentbord öppet */
    #wrapper{
      height: calc(var(--vh) * 100);
      min-height: 100dvh;        /* fallback */
      width:100%;
      display:flex;
      background:#fff;
      border:2px solid var(--hsb-blue-1);
      border-radius:var(--radius);
      overflow:hidden;           /* endast #messages ska scrolla */
    }
    #chatbox{ display:flex; flex-direction:column; width:100%; height:100%; }

    /* Topbar */
    #topbar{
      display:flex; align-items:center; gap:12px;
      padding:14px 16px;
      background:var(--hsb-blue-1); color:#fff;
      border-bottom:1px solid rgba(255,255,255,.15);
      flex-shrink:0;
    }
    .brand-title{ font-weight:700; letter-spacing:.2px; font-size:22px; color:#fff; }
    .brand-sub{ display:none !important; }

    /* Knapprad (kollapsbar) */
    #entryBar{
      padding:14px 16px;
      border-bottom:1px solid #eaeaea;
      background:#fff;
      flex-shrink:0;
      overflow:hidden;
      /* transition via max-height → smidig upp/nerfällning */
      max-height: 1000px;        /* stort nog */
      transition: max-height .28s ease, padding .28s ease, border-color .28s ease;
    }
    #entryBar.collapsed{
      max-height:0;
      padding-top:0; padding-bottom:0;
      border-color:transparent;
    }

    #entryGrid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:18px; }
    .card{
      border-radius:16px; padding:18px; min-height:92px;
      display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
      text-align:left; cursor:pointer; border:1px solid rgba(0,0,0,.06);
      transition:transform .06s ease, box-shadow .2s, border-color .2s, background .2s; color:#fff;
      background:var(--hsb-blue-1);
    }
    .card:hover{ transform:translateY(-2px); box-shadow:0 10px 18px rgba(0,0,0,.18); border-color:rgba(0,0,0,.18); background:var(--hsb-blue-700); }
    .card:focus-visible{ outline:3px solid #fff; box-shadow:0 0 0 4px var(--hsb-blue-5); }
    .card-title{ font-weight:700; font-size:18px; letter-spacing:.2px; display:flex; align-items:center; gap:10px; }
    .card-sub{ margin-top:6px; font-size:14px; line-height:1.35; opacity:.95; }
    .icon{ width:18px; height:18px; display:inline-block; flex:0 0 18px; stroke:currentColor; fill:none; stroke-width:2; }

    /* Liten “Visa genvägar”-knapp när blocken är kollapsade */
    #revealBar{
      position:sticky; top:0; z-index:5;
      display:none; justify-content:center;
      padding:8px 0; background:linear-gradient(#ffffff, #ffffffcc);
    }
    #revealBtn{
      border:1px solid #c2d3e5; background:#fff; color:var(--hsb-blue-1);
      border-radius:999px; padding:8px 12px; font-size:13px; cursor:pointer;
    }
    #revealBtn:hover{ background:#f4f7fb; }

    /* Chattytan – enda som scrollar */
    #messages{
      flex:1; min-height:0;
      padding:16px;
      overflow:auto;
      display:flex; flex-direction:column; gap:12px;
      background:#fff;
      padding-bottom:max(16px, env(safe-area-inset-bottom));
    }
    .message{
      max-width:75%;
      padding:12px 16px;
      border-radius:20px;
      white-space:pre-line; word-break:break-word;
      font-size:16px; line-height:1.45;
      border:1px solid rgba(0,0,0,.06);
      display:inline-block;
    }
    .message.compact{ padding:10px 14px; font-size:15px; line-height:1.45; max-width:600px; border-radius:16px; }
    .user{ align-self:flex-end; background:var(--user-bg); color:#000; border-radius:18px; }
    .bot{ align-self:flex-start; background:var(--bot-bg); color:#000; border-radius:18px; }
    .error{ align-self:center; background:var(--error-bg); color:var(--error); border:1px solid #fecaca; padding:10px 14px; border-radius:12px; }
    .message a.link{ color:#003366; text-decoration:underline; }

    .thinking{ display:inline-flex; align-items:center; gap:6px; padding:8px 12px; background:#f6f7f9; border-radius:14px; border:1px dashed rgba(0,0,0,.1); }
    .dot{ width:8px; height:8px; background-color:#888; border-radius:50%; animation:blink 1.2s infinite; }
    .dot:nth-child(2){ animation-delay:.15s } .dot:nth-child(3){ animation-delay:.3s }
    @keyframes blink{ 0%,80%,100%{opacity:0} 40%{opacity:1} }

    /* Input sticky längst ner */
    #inputArea{
      display:flex; align-items:center; gap:12px;
      padding:12px 16px;
      border-top:1px solid #e0e0e0; background:#fff; position:sticky; bottom:0; z-index:10;
      padding-bottom:calc(12px + env(safe-area-inset-bottom));
      box-shadow:0 -2px 4px rgba(0,0,0,.04); flex-shrink:0;
    }
    textarea{
      flex:1; min-height:44px; max-height:220px;
      padding:14px 18px; border-radius:24px; border:1px solid #ccc; font-size:16px; resize:none; background:#fff;
      -webkit-appearance:none;
    }
    textarea:focus{ border-color:var(--hsb-blue-1); outline:none; box-shadow:0 0 0 3px rgba(0,51,102,.25); }
    #charCount{ font-size:13px; color:#6b7280; }
    button{
      background:var(--hsb-blue-1); color:#fff; border:none; border-radius:24px;
      padding:14px 18px; font-size:16px; cursor:pointer; transition:transform .02s, background .2s;
      display:flex; align-items:center; gap:8px; min-height:44px;
    }
    button:hover{ background:var(--hsb-blue-700); } button:active{ transform:translateY(1px); }

    /* Responsivt */
    @media (max-width: 980px){ #entryGrid{ grid-template-columns:repeat(2, 1fr); } }
    @media (max-width: 600px){
      #entryGrid{ grid-template-columns:1fr; gap:14px; }
      #messages{ padding:12px }
      .message{ max-width:96%; font-size:15px; border-radius:16px }
      .message.compact{ max-width:96%; }
      .brand-title{ font-size:20px } #topbar{ padding:12px 14px }
      textarea{ min-height:44px; font-size:16px } button{ padding:12px 16px; font-size:16px }
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="chatbox">
      <!-- Topbar -->
      <div id="topbar" role="banner" aria-label="HSB Bostad">
        <div class="brand-title">HSB Bostad</div>
        <div class="brand-sub">kundsupport</div>
      </div>

      <!-- Liten rad som visas när blocken är kollapsade -->
      <div id="revealBar"><button id="revealBtn" type="button" aria-label="Visa genvägar">Visa genvägar</button></div>

      <!-- Knappraden (kollapsbar) -->
      <div id="entryBar">
        <div id="entryGrid">
          <button class="card" data-entry="buy">
            <span class="card-title">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.65" y1="16.65" x2="21" y2="21"></line></svg>
              Köpa bostad
            </span>
            <span class="card-sub">Se aktuella projekt i försäljning</span>
          </button>

          <button class="card" data-entry="browse">
            <span class="card-title">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="3,12 12,3 21,12"></polyline><rect x="6" y="12" width="12" height="9"></rect></svg>
              Här hittar du din bostad
            </span>
            <span class="card-sub">Utforska hela utbudet</span>
          </button>

          <button class="card" data-entry="member">
            <span class="card-title">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="12" r="3"></circle><line x1="10" y1="12" x2="21" y2="12"></line><line x1="18" y1="9" x2="21" y2="9"></line><line x1="18" y1="15" x2="21" y2="15"></line></svg>
              Börja bospara
            </span>
            <span class="card-sub">Förtur till nyproduktion</span>
          </button>

          <button class="card" data-entry="contact">
            <span class="card-title">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="8"></line><line x1="12" y1="12" x2="12" y2="16"></line></svg>
              Kontakt
            </span>
            <span class="card-sub">Skicka en fråga</span>
          </button>
        </div>
      </div>

      <!-- Chatt -->
      <div id="messages" aria-live="polite" role="log">
        <div class="message bot"><strong>Välkommen till HSB Bostad</strong><br><br>Här kan du snabbt komma vidare. Välj en av knapparna ovan så visar jag information direkt här i chatten – utan att du behöver lämna sidan.</div>
      </div>

      <!-- Input -->
      <div id="inputArea">
        <textarea id="userInput" placeholder="Skriv din fråga här..." maxlength="1000" aria-label="chattinmatning"></textarea>
        <span id="charCount" aria-live="polite">0/1000</span>
        <button id="sendBtn" aria-label="skicka fråga" title="skicka (enter)">Skicka</button>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const ENDPOINT = '/.netlify/functions/hsbbostad-gpt';
    const BOSPAR_URL = 'https://www.hsb.se/bospara/';
    const KONTAKT_URL = 'https://www.hsb.se/sodertorn/kontakta-oss/';

    const entryBar = document.getElementById('entryBar');
    const revealBar = document.getElementById('revealBar');
    const revealBtn = document.getElementById('revealBtn');
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const charCount = document.getElementById('charCount');

    let history = [];
    let busy = false;

    /* Dynamisk viewport-höjd för mobil */
    function setVH(){
      const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    setVH();
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', setVH);
    if (window.visualViewport){
      window.visualViewport.addEventListener('resize', setVH);
    }

    /* Kollaps/expand av blockraden */
    function collapseEntries(){
      if (!entryBar.classList.contains('collapsed')){
        entryBar.classList.add('collapsed');
        revealBar.style.display = 'flex';
        // se konversationen direkt
        setTimeout(()=>{ messagesEl.scrollTop = messagesEl.scrollHeight; }, 30);
      }
    }
    function expandEntries(){
      entryBar.classList.remove('collapsed');
      revealBar.style.display = 'none';
    }
    revealBtn.addEventListener('click', expandEntries);

    // Kollapsa på fokus i input, på knapptryck och när man skickar
    input.addEventListener('focus', () => { collapseEntries(); setTimeout(()=>input.scrollIntoView({block:'end'}), 50); });

    document.querySelectorAll('[data-entry]').forEach(btn=>{
      btn.addEventListener('click', () => { handleEntry(btn.getAttribute('data-entry')); collapseEntries(); });
      btn.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); btn.click(); }});
    });

    function formatForDisplay(t){
      if(!t) return '';
      let s = ('' + t).trim();
      s = s.replace(/(^\s*[a-zåäö])|([.!?]\s+[a-zåäö])/g, m => m.toUpperCase());
      s = s.replace(/\bbrf(:?[:\-]?[\wåäö]+)?\b/gi, m => m.toLowerCase());
      return s;
    }
    function addMessage(role, text, extraClass=''){
      const div = document.createElement('div');
      div.className = role === 'error' ? 'error' : `message ${role}${extraClass?(' '+extraClass):''}`;
      if (text == null) {
        div.innerHTML = `<span class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>`;
      } else {
        div.textContent = formatForDisplay(text);
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }
    function addBotHtml(html, extraClass=''){
      const div = document.createElement('div');
      div.className = `message bot${extraClass?(' '+extraClass):''}`;
      div.innerHTML = html;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }
    function showError(msg){ addMessage('error', msg); }
    function autoResize(el){ el.style.height='auto'; el.style.height = Math.min(220, el.scrollHeight) + 'px'; }
    function updateCharCount(el){ if(charCount) charCount.textContent = `${el.value.length}/1000`; }

    async function callApi(body){
      const r = await fetch(ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
      if(!r.ok) throw new Error(`http ${r.status}`);
      return r.json();
    }

    function handleEntry(key){
      switch(key){
        case 'buy':
          addMessage('bot','Skriv gärna vad du söker så visar jag aktuella projekt i försäljning här i chatten.','compact');
          input.focus({preventScroll:true});
          break;
        case 'browse':
          addMessage('bot','Berätta gärna ort, antal rum eller prisnivå så visar jag förslag ur hela vårt utbud.','compact');
          input.focus({preventScroll:true});
          break;
        case 'member': {
          const html = `
            <strong>Få förtur – börja bospara hos HSB</strong><br>
            Samla köpoäng och öka chansen till nyproduktion. Det tar ett par minuter att komma igång,
            och du kan när som helst pausa eller ändra belopp.
            <a class="link" href="${'https://www.hsb.se/bospara/'}" target="_blank" rel="noopener" style="margin-left:6px;">
              Läs mer & starta i ny flik
            </a>`;
          addBotHtml(html,'compact');
          input.focus({preventScroll:true});
          break;
        }
        case 'contact':
          window.location.href = 'https://www.hsb.se/sodertorn/kontakta-oss/';
          break;
      }
    }

    async function sendMessage(){
      if(busy) return;
      const raw = (input.value || '').trim(); if(!raw) return;

      collapseEntries();                 // säkerställ att blocken är borta vid konversation

      busy = true; sendBtn.disabled = true; messagesEl.setAttribute('aria-busy','true');
      addMessage('user', raw);
      history.push({ role:'user', content: raw });

      input.value = ''; updateCharCount(input); autoResize(input);

      const thinking = addMessage('bot', null);
      try{
        const sys = "du är hsb bostads kundsupport. skriv sakligt och omtänksamt. börja alltid varje mening med stor bokstav. skriv 'brf' och 'brf:er' med gemener. inga emojis.";
        const msgs = [{ role:'system', content: sys }, ...history];
        const data = await callApi({ messages: msgs });
        const svar = (data?.choices?.[0]?.message?.content || 'Kunde inte generera svar.').trim();
        thinking.remove();
        addMessage('bot', svar);
        history.push({ role:'assistant', content: svar });
      }catch(err){
        thinking.remove();
        showError(String(err).includes('http 429') ? 'Många frågor samtidigt – prova igen strax.' : 'Något gick fel, försök igen senare.');
      }finally{
        busy = false; sendBtn.disabled = false; messagesEl.setAttribute('aria-busy','false');
        setTimeout(()=>{ input.focus({preventScroll:true}); messagesEl.scrollTop = messagesEl.scrollHeight; }, 50);
      }
    }

    function handleKey(e){
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
      if((e.key === 'Enter' && (e.metaKey || e.ctrlKey))){ e.preventDefault(); input.value += '\n'; autoResize(input); updateCharCount(input); }
    }

    /* init */
    if(sendBtn) sendBtn.addEventListener('click', sendMessage);
    if(input){
      input.addEventListener('keydown', handleKey);
      input.addEventListener('input', () => { updateCharCount(input); autoResize(input); messagesEl.scrollTop = messagesEl.scrollHeight; });
      updateCharCount(input); autoResize(input);
    }
  })();
  </script>
</body>
</html>
