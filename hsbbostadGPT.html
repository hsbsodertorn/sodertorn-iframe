<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HSB Bostad – kundsupport GPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">

  <style>
    :root{
      --hsb-blue-1:#003366;   /* topplist/blå ram */
      --hsb-blue-700:#00264d;
      --project-card-bg:#996600;      /* önskad färg för korten */
      --project-card-bg-hover:#7a5200;/* lite mörkare vid hover */
      --surface:#ffffff;
      --text:#0e1012;
      --muted:#6b7280;
      --ring:rgba(0,51,102,.28);
      --radius:16px;
      --user-bg:#f7f7f8;
      --bot-bg:#e8f0fe;
      --error:#b91c1c;
      --error-bg:#ffe6e6;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; overflow:hidden; }
    body{
      font-family:'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#fff; color:var(--text); min-height:100svh;
    }

    /* Yttre ram */
    #wrapper{
      height:100%; width:100%;
      display:flex; padding:0; background:#fff;
      border:2px solid var(--hsb-blue-1); border-radius:var(--radius);
      overflow:hidden;
    }

    #chatbox{ display:flex; flex-direction:column; width:100%; height:100%; background:var(--surface); }

    /* TOPPLIST – blå med vit text */
    #topbar{
      display:flex; align-items:center; gap:12px; padding:14px 16px;
      background:var(--hsb-blue-1); color:#fff; border-bottom:1px solid rgba(255,255,255,.15);
      flex-shrink:0;
    }
    .brand-title{ font-weight:700; letter-spacing:.2px; font-size:22px; color:#fff; }
    .brand-sub{ display:none !important; }

    /* PROJEKTVÄLJARE – tre mindre rutor */
    #projectSelect{ padding:12px 16px; border-bottom:1px solid #eaeaea; background:#fff; flex-shrink:0; }
    #projectSelect .grid{
      display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;
    }
    .project-card{
      background:var(--project-card-bg);
      border:1px solid rgba(0,0,0,.06);
      border-radius:12px;
      padding:14px 12px;
      min-height:100px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      cursor:pointer; text-align:center;
      transition:transform .06s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
      color:#fff;
    }
    .project-card:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 22px rgba(0,0,0,.18);
      background:var(--project-card-bg-hover);
      border-color:rgba(0,0,0,.18);
    }
    .project-card:focus{ outline:none; }
    .project-card:focus-visible{ box-shadow:0 0 0 3px var(--ring); }

    /* Namn + undertext */
    .project-name{
      font-weight:700; font-size:18px; letter-spacing:.2px; color:#fff;
    }
    .project-sub{
      margin-top:4px;
      font-size:14px; line-height:1.3;
      color:rgba(255,255,255,.92);
    }

    /* CHATT */
    #messages{
      flex:1; min-height:0; padding:16px; overflow:auto; background:#fff;
      display:flex; flex-direction:column; gap:12px;
    }
    .message{
      max-width:75%; padding:12px 16px; border-radius:20px; white-space:pre-line; word-break:break-word;
      font-size:16px; line-height:1.45; border:1px solid rgba(0,0,0,.06); display:inline-block;
    }
    .user{ align-self:flex-end; background:var(--user-bg); color:#000; border-radius:18px; }
    .bot, .bot-question{ align-self:flex-start; background:var(--bot-bg); color:#000; border-radius:18px; }
    .error{ align-self:center; background:var(--error-bg); color:var(--error); border:1px solid #fecaca; padding:10px 14px; border-radius:12px; }

    .thinking{ display:inline-flex; align-items:center; gap:6px; padding:8px 12px; background:#f6f7f9; border-radius:14px; border:1px dashed rgba(0,0,0,.1); }
    .dot{ width:8px; height:8px; background-color:#888; border-radius:50%; animation:blink 1.2s infinite; }
    .dot:nth-child(2){ animation-delay:.15s } .dot:nth-child(3){ animation-delay:.3s }
    @keyframes blink{ 0%,80%,100%{opacity:0} 40%{opacity:1} }

    #inputArea{
      display:flex; align-items:center; gap:12px; padding:12px 16px;
      border-top:1px solid #e0e0e0; background:#fff; position:sticky; bottom:0; z-index:10;
      padding-bottom:calc(12px + env(safe-area-inset-bottom)); box-shadow:0 -2px 4px rgba(0,0,0,.04); flex-shrink:0;
    }
    textarea{
      flex:1; min-height:52px; max-height:220px; padding:14px 18px;
      border-radius:24px; border:1px solid #ccc; font-size:16px; resize:none; background:#fff;
    }
    textarea:focus{ border-color:var(--hsb-blue-1); outline:none; box-shadow:0 0 0 3px rgba(0,51,102,.25); }
    #charCount{ font-size:13px; color:var(--muted); }
    button{
      background:var(--hsb-blue-1); color:#fff; border:none; border-radius:24px;
      padding:14px 18px; font-size:16px; cursor:pointer; transition:transform .02s, background .2s;
      display:flex; align-items:center; gap:8px; min-height:44px;
    }
    button:hover{ background:var(--hsb-blue-700); } button:active{ transform:translateY(1px); }

    @media (max-width: 900px){ #projectSelect .grid{ grid-template-columns:1fr; } }
    @media (max-width: 640px){
      body{ min-height:100dvh; }
      #messages{ padding:12px }
      .message{ max-width:92%; font-size:15px; border-radius:16px }
      .brand-title{ font-size:20px } #topbar{ padding:12px 14px }
      .project-card{ min-height:84px; }
      textarea{ min-height:48px; font-size:16px } button{ padding:12px 16px; font-size:16px }
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="chatbox">
      <!-- TOPPLIST: blå med vit rubrik -->
      <div id="topbar" role="banner" aria-label="HSB Bostad">
        <div class="brand-title">HSB Bostad</div>
        <div class="brand-sub">kundsupport</div>
      </div>

      <!-- PROJEKTRUTOR: #996600 med undertext -->
      <nav id="projectSelect" aria-label="Välj projekt">
        <div class="grid">
          <button class="project-card" data-projekt="Ester"
                  data-trigger="Hej, vad vill du veta om Ester?">
            <span class="project-name">Ester</span>
            <span class="project-sub">Chatta om projektet</span>
          </button>

          <button class="project-card" data-projekt="Diktafonen"
                  data-trigger="Hej, vad vill du veta om Diktafonen?">
            <span class="project-name">Diktafonen</span>
            <span class="project-sub">Chatta om projektet</span>
          </button>

          <button class="project-card" data-projekt="Växeln"
                  data-trigger="Hej, vad vill du veta om Växeln?">
            <span class="project-name">Växeln</span>
            <span class="project-sub">Chatta om projektet</span>
          </button>
        </div>
      </nav>

      <div id="messages" aria-live="polite" role="log">
        <div class="message bot"><strong>Välkommen till HSB Bostad</strong><br><br>Berätta gärna vilket projekt eller ort det gäller och om du är köpare, boende eller intressent – så hjälper jag dig snabbare.</div>
      </div>

      <div id="inputArea">
        <textarea id="userInput" placeholder="Skriv din fråga här..." maxlength="1000" aria-label="chattinmatning"></textarea>
        <span id="charCount" aria-live="polite">0/1000</span>
        <button id="sendBtn" aria-label="skicka fråga" title="skicka (enter)">Skicka</button>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const ENDPOINT = '/.netlify/functions/hsbbostad-gpt';

    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const charCount = document.getElementById('charCount');

    const conversationId = `${Date.now()}-${(crypto.randomUUID?.() || Math.random().toString(36).slice(2))}`;
    let history = []; let busy = false; let selectedProject = null;

    function persist(){ try {
      localStorage.setItem('hsb-chat-history', JSON.stringify(history));
      if (selectedProject) localStorage.setItem('hsb-selected-project', selectedProject);
    } catch {} }
    function restore(){
      try{
        const raw = localStorage.getItem('hsb-chat-history');
        if(raw){
          const arr = JSON.parse(raw);
          if(Array.isArray(arr)){ history = arr; for(const m of arr){ addMessage(m.role === 'assistant' ? 'bot' : m.role, m.content); } }
        }
        const savedProj = localStorage.getItem('hsb-selected-project');
        if (savedProj) selectedProject = savedProj;
      }catch{}
    }

    function formatForDisplay(t){
      if(!t) return ''; let s = ('' + t).trim();
      s = s.replace(/(^\s*[a-zåäö])|([.!?]\s+[a-zåäö])/g, m => m.toUpperCase());
      s = s.replace(/\bbrf(:?[:\-]?[\wåäö]+)?\b/gi, m => m.toLowerCase());
      return s;
    }
    function addMessage(role, text){
      const div = document.createElement('div');
      div.className = role === 'error' ? 'error' : `message ${role}`;
      if (text == null) {
        div.innerHTML = `<span class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>`;
      } else {
        div.textContent = formatForDisplay(text);
      }
      messagesEl.appendChild(div); messagesEl.scrollTop = messagesEl.scrollHeight; return div;
    }
    function showError(msg){ addMessage('error', msg); }
    function autoResize(el){ el.style.height='auto'; el.style.height = Math.min(220, el.scrollHeight) + 'px'; }
    function updateCharCount(el){ if(charCount) charCount.textContent = `${el.value.length}/1000`; }

    async function callApi(body){ const r = await fetch(ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
      if(!r.ok) throw new Error(`http ${r.status}`); return r.json(); }

    async function sendMessage(){
      if(busy) return; const raw = (input.value || '').trim(); if(!raw) return;
      busy = true; sendBtn.disabled = true; messagesEl.setAttribute('aria-busy','true');

      addMessage('user', raw); history.push({ role:'user', content: raw }); persist();
      input.value = ''; updateCharCount(input); autoResize(input);

      const thinking = addMessage('bot', null);
      try{
        const data = await callApi({ messages: buildSafeMessages(history) });
        const svarRaw = (data?.choices?.[0]?.message?.content || 'Kunde inte generera svar.').trim();
        const svar = formatForDisplay(svarRaw);

        thinking.remove(); addMessage('bot', svar);
        history.push({ role:'assistant', content: svar }); persist();
      }catch(err){
        console.error(err); thinking.remove();
        showError(String(err).includes('http 429') ? 'Många frågor samtidigt – prova igen strax.' : 'Något gick fel, försök igen senare.');
      }finally{
        busy = false; sendBtn.disabled = false; messagesEl.setAttribute('aria-busy','false'); input.focus();
      }
    }

    function buildSafeMessages(clientMessages){
      const SYS_PROMPT =
        "du är hsb bostads kundsupport. skriv sakligt och omtänksamt. börja alltid varje mening med stor bokstav. skriv 'brf' och 'brf:er' med gemener. använd exempel från huddinge, botkyrka, tullinge, nynäshamn, visby och hemse där det passar. inga emojis.";
      const msgs = [{ role:'system', content: SYS_PROMPT }];
      if (selectedProject){
        msgs.push({ role:'system',
          content:`aktuellt_projekt: ${selectedProject}\ninstruera: anpassa svar, exempel och hänvisningar till projektet "${selectedProject}".` });
      }
      for(const m of clientMessages){ if(m && m.role !== 'system'){ msgs.push(m); } }
      return msgs;
    }

    function handleKey(e){
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
      if((e.key === 'Enter' && (e.metaKey || e.ctrlKey))){ e.preventDefault(); input.value += '\n'; autoResize(input); updateCharCount(input); }
    }

    // PROJEKTRUTOR: trigga fras
    function triggerConversation(phrase, projectName){
      if (projectName) { selectedProject = projectName; persist(); }
      input.value = phrase || ''; if (input.value) sendMessage();
    }
    document.querySelectorAll('.project-card').forEach(btn => {
      btn.addEventListener('click', () => {
        const phrase = btn.getAttribute('data-trigger') || '';
        const proj = btn.getAttribute('data-projekt') || btn.textContent.trim();
        triggerConversation(phrase, proj);
      });
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
      });
    });

    if(sendBtn) sendBtn.addEventListener('click', sendMessage);
    if(input){
      input.addEventListener('keydown', handleKey);
      input.addEventListener('input', () => { updateCharCount(input); autoResize(input); });
      updateCharCount(input); autoResize(input);
    }
    restore();
  })();
  </script>
</body>
</html>
