<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>HSB Bostad – kundsupport GPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    :root{
      --hsb-blue-1:#003366;
      --hsb-blue-700:#00264d;
      --hsb-blue-5:#CBE8F1;
      --vh: 1vh;
      --radius:16px;
      --user-bg:#f7f7f8;
      --bot-bg:#e8f0fe;
      --error:#b91c1c;
      --error-bg:#ffe6e6;
    }
    *, *::before, *::after { box-sizing:border-box; }
    html, body {
      height: 100%;
      margin: 0; padding: 0;
      background:#fff; color:#0e1012;
      font-family:'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    #wrapper{
      height: calc(var(--vh) * 100);
      min-height: 100dvh;
      width:100%;
      display:flex;
      background:#fff;
      border:2px solid var(--hsb-blue-1);
      border-radius:var(--radius);
      overflow:hidden;
    }
    #chatbox{ display:flex; flex-direction:column; width:100%; height:100%; }

    /* Topbar */
    #topbar{
      display:flex; align-items:center; gap:12px;
      padding:14px 16px;
      background:var(--hsb-blue-1); color:#fff;
      border-bottom:1px solid rgba(255,255,255,.15);
      flex-shrink:0;
    }
    .brand-title{ font-weight:700; letter-spacing:.2px; font-size:22px; color:#fff; }

    /* Chatlistan – scrollar */
    #messages{
      flex:1; min-height:0;
      padding:16px;
      overflow:auto;
      display:flex; flex-direction:column; gap:12px;
      background:#fff;
      padding-bottom:max(12px, env(safe-area-inset-bottom));
    }
    .message{
      max-width:75%;
      padding:12px 16px;
      border-radius:20px;
      white-space:pre-line; word-break:break-word;
      font-size:16px; line-height:1.45;
      border:1px solid rgba(0,0,0,.06);
      display:inline-block;
    }
    .user{ align-self:flex-end; background:var(--user-bg); }
    .bot{ align-self:flex-start; background:var(--bot-bg); }
    .error{ align-self:center; background:var(--error-bg); color:var(--error); border:1px solid #fecaca; padding:10px 14px; border-radius:12px; }

    .thinking{ display:inline-flex; align-items:center; gap:6px; padding:8px 12px; background:#f6f7f9; border-radius:14px; border:1px dashed rgba(0,0,0,.1); }
    .dot{ width:8px; height:8px; background-color:#888; border-radius:50%; animation:blink 1.2s infinite; }
    .dot:nth-child(2){ animation-delay:.15s } .dot:nth-child(3){ animation-delay:.3s }
    @keyframes blink{ 0%,80%,100%{opacity:0} 40%{opacity:1} }

    /* Input sticky längst ner */
    #inputArea{
      display:flex; align-items:center; gap:12px;
      padding:12px 16px;
      border-top:1px solid #e0e0e0; background:#fff; position:sticky; bottom:0; z-index:10;
      padding-bottom:calc(12px + env(safe-area-inset-bottom));
      box-shadow:0 -2px 4px rgba(0,0,0,.04); flex-shrink:0;
      pointer-events:auto;
    }
    textarea{
      flex:1; min-height:44px; max-height:220px;
      padding:14px 18px; border-radius:24px; border:1px solid #ccc; font-size:16px; resize:none; background:#fff;
      -webkit-appearance:none;
    }
    textarea:focus{ border-color:var(--hsb-blue-1); outline:none; box-shadow:0 0 0 3px rgba(0,51,102,.25); }
    #charCount{ font-size:13px; color:#6b7280; min-width:64px; text-align:right; }
    button{
      background:var(--hsb-blue-1); color:#fff; border:none; border-radius:24px;
      padding:14px 18px; font-size:16px; cursor:pointer; transition:transform .02s, background .2s;
      display:flex; align-items:center; gap:8px; min-height:44px;
    }
    button:hover{ background:var(--hsb-blue-700); } button:active{ transform:translateY(1px); }
    button:disabled{ opacity:.6; cursor:not-allowed; }

    @media (max-width: 600px){
      #messages{ padding:12px }
      .message{ max-width:96%; font-size:15px; border-radius:16px }
      .brand-title{ font-size:20px } #topbar{ padding:12px 14px }
      textarea{ min-height:44px; font-size:16px } button{ padding:12px 16px; font-size:16px }
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="chatbox">
      <div id="topbar" role="banner" aria-label="HSB Bostad">
        <div class="brand-title">HSB Bostad</div>
      </div>

      <div id="messages" aria-live="polite" role="log">
        <div class="message bot"><strong>Välkommen till HSB Bostad</strong><br><br>Ställ din fråga här i chatten – jag hjälper dig med projekt, utbud, bospar</div>
      </div>

      <!-- Viktigt: type="button" så att klick inte försöker posta ett osynligt form -->
      <div id="inputArea">
        <textarea id="userInput" placeholder="Skriv din fråga här..." maxlength="1000" aria-label="chattinmatning" autocomplete="off"></textarea>
        <span id="charCount" aria-live="polite">0/1000</span>
        <button id="sendBtn" type="button" aria-label="Skicka" title="Skicka (Enter)">Skicka</button>
      </div>
    </div>
  </div>

  <script>
  (function(){
    // Byt vid behov till rätt serverfunktion
    const ENDPOINT = '/.netlify/functions/hsbbostad-gpt';

    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const charCount = document.getElementById('charCount');

    let history = [];
    let busy = false;

    /* Fix för mobil: korrekt höjd även med tangentbordet öppet */
    function setVH(){
      const base = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
      document.documentElement.style.setProperty('--vh', (base * 0.01) + 'px');
    }
    setVH();
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', setVH);
    if (window.visualViewport){
      window.visualViewport.addEventListener('resize', () => {
        setVH();
        // håll input inom vy
        setTimeout(() => input?.scrollIntoView({block:'nearest'}), 0);
      });
    }

    function formatForDisplay(t){
      if(!t) return '';
      let s = ('' + t).trim();
      s = s.replace(/(^\s*[a-zåäö])|([.!?]\s+[a-zåäö])/g, m => m.toUpperCase());
      s = s.replace(/\bbrf(:?[:\-]?[\wåäö]+)?\b/gi, m => m.toLowerCase());
      return s;
    }
    function addMessage(role, text){
      const div = document.createElement('div');
      div.className = role === 'error' ? 'error' : `message ${role}`;
      if (text == null) {
        div.innerHTML = `<span class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>`;
      } else {
        div.textContent = formatForDisplay(text);
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }
    function showError(msg){ addMessage('error', msg); }
    function autoResize(el){ el.style.height='auto'; el.style.height = Math.min(220, el.scrollHeight) + 'px'; }
    function updateCharCount(el){ if(charCount) charCount.textContent = `${el.value.length}/1000`; }

    async function callApi(body){
      const r = await fetch(ENDPOINT, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify(body)
      }).catch(err => { throw new Error('fetch_failed'); });

      if(!r || !r.ok){ throw new Error(`http_${r ? r.status : 'fetch'}`); }
      return r.json();
    }

    async function sendMessage(){
      if(busy) return;
      const raw = (input.value || '').trim();
      if(!raw) return;

      busy = true;
      sendBtn.disabled = true;
      messagesEl.setAttribute('aria-busy','true');

      addMessage('user', raw);
      history.push({ role:'user', content: raw });

      input.value = '';
      updateCharCount(input);
      autoResize(input);

      const thinking = addMessage('bot', null);
      try{
        const sys = "Du är en digital kundvärd för HSB Bostad.  
Din uppgift är att hjälpa privatpersoner att förstå och hitta rätt information om:
- HSB Bostads bostadsprojekt, nyproduktion och utbud  
- Boköp, intresseanmälan, köprocess, tilldelning och avtal  
- HSB bospar, grundläggande regler och hur bospar kopplas till att köpa bostad  
- Kontaktvägar till HSB Bostad och var användaren kan läsa mer på webben  

Stil och ton:
- Skriv på svenska
- Skriv sakligt, tydligt och omtänksamt
- Använd "du" till användaren, professionellt men varmt
- Skriv alltid meningar med stor begynnelsebokstav
- Skriv "brf" och "brf:er" med gemener
- Använd korta stycken och gärna punktlistor när det blir tydligare
- Inga emojis

Begränsningar:
- Gissa inte om priser, avgifter eller andra siffror som kan ändras över tid. Säg hellre att användaren hittar aktuella uppgifter på hsb.se eller projektsidan.
- Ge inte juridiska råd, finansiell rådgivning eller bindande besked. Förklara i stället hur processen brukar se ut och hänvisa till HSB Bostad för formella besked.
- Ge inte råd om enskilda personers ekonomi eller kreditvärdighet.
- Om frågan gäller något utanför HSB Bostad, HSB generellt eller bospar, ge ett kort generellt svar och förklara att du i första hand är tränad för frågor om HSB Bostad.

Personuppgifter och integritet:
- Be aldrig aktivt om personnummer, kontonummer eller andra känsliga personuppgifter.
- Om användaren ändå skriver personliga uppgifter, svara sakligt men lagra eller använd inte dessa uppgifter i resonemanget mer än nödvändigt för att förstå frågan.
- Om ärendet kräver handläggning eller insyn i personliga uppgifter, hänvisa till HSB Bostads ordinarie kundservicekanaler.

När du är osäker:
- Om du är osäker, var tydlig med osäkerheten, och hänvisa till att användaren kan verifiera uppgifterna på hsb.se eller genom att kontakta HSB Bostad.
- Sammanfatta gärna svaret kort i slutet så att användaren enkelt ser nästa steg.
";
        const msgs = [{ role:'system', content: sys }, ...history];
        const data = await callApi({ messages: msgs });

        const svar = (data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content)
                      ? data.choices[0].message.content.trim()
                      : 'Kunde inte generera svar.';
        thinking.remove();
        addMessage('bot', svar);
        history.push({ role:'assistant', content: svar });

      }catch(err){
        thinking.remove();
        // Viktigt: visa fel så man ser att klick/enter fungerade
        showError('Kunde inte kontakta tjänsten just nu. Försök igen om en stund.');
        console.error('HSB Bostad chat error:', err);
      }finally{
        busy = false;
        sendBtn.disabled = false;
        messagesEl.setAttribute('aria-busy','false');
        setTimeout(()=>{ input.focus({preventScroll:true}); messagesEl.scrollTop = messagesEl.scrollHeight; }, 50);
      }
    }

    function handleKey(e){
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
      // Shift+Enter ger radbrytning
      if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
        e.preventDefault();
        input.value += '\n';
        autoResize(input);
        updateCharCount(input);
      }
    }

    // Init – säkra att händelser verkligen kopplas
    document.addEventListener('DOMContentLoaded', () => {
      if(sendBtn) sendBtn.addEventListener('click', sendMessage, { passive: true });
      if(input){
        input.addEventListener('keydown', handleKey);
        input.addEventListener('input', () => { updateCharCount(input); autoResize(input); });
        input.addEventListener('focus', () => setTimeout(()=> input.scrollIntoView({block:'nearest'}), 0));
        updateCharCount(input);
        autoResize(input);
      }
    });
    // Kör init direkt också, ifall scriptet ligger sist i body
    if(sendBtn){ sendBtn.addEventListener('click', sendMessage, { passive: true }); }
    if(input){
      input.addEventListener('keydown', handleKey);
      input.addEventListener('input', () => { updateCharCount(input); autoResize(input); });
      input.addEventListener('focus', () => setTimeout(()=> input.scrollIntoView({block:'nearest'}), 0));
      updateCharCount(input);
      autoResize(input);
    }
  })();
  </script>
</body>
</html>
