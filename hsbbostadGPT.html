<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HSB Bostad – kundsupport GPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    :root{
      /* HSB-färger */
      --hsb-blue-1:#003366;
      --hsb-blue-700:#00264d;
      --hsb-blue-5:#CBE8F1;
      --hsb-gold:#BE880B;
      --hsb-gold-700:#996600;
      --hsb-steel:#5F7D8B;

      /* Komponentfärger */
      --surface:#ffffff;
      --text:#0e1012;
      --muted:#6b7280;
      --ring:rgba(0,51,102,.28);
      --radius:16px;

      --user-bg:#f7f7f8;
      --bot-bg:#e8f0fe;
      --error:#b91c1c;
      --error-bg:#ffe6e6;
    }

    *, *::before, *::after { box-sizing:border-box; }
    html, body { margin:0; padding:0; height:100%; overflow:hidden; }
    body{
      font-family:'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#fff; color:var(--text); min-height:100svh;
    }

    #wrapper{ height:100%; width:100%; display:flex; padding:0; background:#fff;
      border:2px solid var(--hsb-blue-1); border-radius:var(--radius); overflow:hidden; }
    #chatbox{ display:flex; flex-direction:column; width:100%; height:100%; background:var(--surface); }

    /* Topplista */
    #topbar{
      display:flex; align-items:center; gap:12px; padding:14px 16px;
      background:var(--hsb-blue-1); color:#fff; border-bottom:1px solid rgba(255,255,255,.15);
      flex-shrink:0;
    }
    .brand-title{ font-weight:700; letter-spacing:.2px; font-size:22px; color:#fff; }
    .brand-sub{ display:none !important; }

    /* Ingångar & projekt */
    #projectSelect{ padding:14px 16px; border-bottom:1px solid #eaeaea; background:#fff; flex-shrink:0; }
    #projectSelect .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:18px;
    }

    /* Backbar + tabs */
    .bar{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; margin-bottom:12px;
    }
    .backbtn{
      display:inline-flex; align-items:center; gap:8px;
      background:transparent; border:1px solid rgba(0,0,0,.12);
      color:var(--hsb-blue-1); border-radius:999px; padding:8px 12px; cursor:pointer;
    }
    .backbtn:hover{ background:#f4f6f8; }
    .backbtn:focus-visible{ outline:3px solid var(--hsb-blue-5); }
    .backbtn .icon{ stroke:currentColor }

    .tabs{
      display:flex; align-items:center; gap:6px; flex-wrap:wrap;
      border:1px solid rgba(0,0,0,.08); border-radius:999px; padding:4px;
      background:#fff;
    }
    .tab{
      appearance:none; border:none; border-radius:999px; padding:8px 12px; cursor:pointer;
      background:transparent; color:#0e1012;
    }
    .tab[aria-selected="true"]{
      background:var(--hsb-blue-1); color:#fff;
    }
    .tab:focus-visible{ outline:3px solid var(--hsb-blue-5); }

    /* Kort */
    .card{
      border-radius:12px; padding:12px 14px; min-height:78px;
      display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
      text-align:left; cursor:pointer; border:1px solid rgba(0,0,0,.06);
      transition:transform .06s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
      color:#fff;
    }
    .card:hover{ transform:translateY(-2px); box-shadow:0 10px 18px rgba(0,0,0,.16);
      border-color:rgba(0,0,0,.18); }
    .card:focus-visible{ outline:3px solid #fff; box-shadow:0 0 0 4px var(--hsb-blue-5); }
    .card--primary{ background:var(--hsb-blue-1); }
    .card--primary:hover{ background:var(--hsb-blue-700); }
    .card--gold{ background:var(--hsb-gold); }
    .card--gold:hover{ background:var(--hsb-gold-700); }
    .card--light{ background:var(--hsb-blue-5); color:#0e1012; border-color:rgba(0,0,0,.08); }
    .card--light:hover{ background:#b9deec; }

    .card-title{ font-weight:700; font-size:16px; letter-spacing:.2px; display:flex; align-items:center; gap:10px; }
    .card-sub{ margin-top:4px; font-size:13px; line-height:1.35; opacity:.95; }

    .icon{
      width:18px; height:18px; display:inline-block; flex:0 0 18px;
      stroke:currentColor; fill:none; stroke-width:2;
    }

    /* Chatt */
    #messages{ flex:1; min-height:0; padding:16px; overflow:auto; background:#fff;
      display:flex; flex-direction:column; gap:12px; }
    .message{
      max-width:75%; padding:12px 16px; border-radius:20px; white-space:pre-line; word-break:break-word;
      font-size:16px; line-height:1.45; border:1px solid rgba(0,0,0,.06); display:inline-block;
    }
    .user{ align-self:flex-end; background:var(--user-bg); color:#000; border-radius:18px; }
    .bot{ align-self:flex-start; background:var(--bot-bg); color:#000; border-radius:18px; }
    .error{ align-self:center; background:var(--error-bg); color:var(--error); border:1px solid #fecaca; padding:10px 14px; border-radius:12px; }

    .thinking{ display:inline-flex; align-items:center; gap:6px; padding:8px 12px; background:#f6f7f9; border-radius:14px; border:1px dashed rgba(0,0,0,.1); }
    .dot{ width:8px; height:8px; background-color:#888; border-radius:50%; animation:blink 1.2s infinite; }
    .dot:nth-child(2){ animation-delay:.15s } .dot:nth-child(3){ animation-delay:.3s }
    @keyframes blink{ 0%,80%,100%{opacity:0} 40%{opacity:1} }

    #inputArea{
      display:flex; align-items:center; gap:12px; padding:12px 16px;
      border-top:1px solid #e0e0e0; background:#fff; position:sticky; bottom:0; z-index:10;
      padding-bottom:calc(12px + env(safe-area-inset-bottom)); box-shadow:0 -2px 4px rgba(0,0,0,.04); flex-shrink:0;
    }
    textarea{
      flex:1; min-height:52px; max-height:220px; padding:14px 18px;
      border-radius:24px; border:1px solid #ccc; font-size:16px; resize:none; background:#fff;
    }
    textarea:focus{ border-color:var(--hsb-blue-1); outline:none; box-shadow:0 0 0 3px rgba(0,51,102,.25); }
    #charCount{ font-size:13px; color:var(--muted); }
    button{
      background:var(--hsb-blue-1); color:#fff; border:none; border-radius:24px;
      padding:14px 18px; font-size:16px; cursor:pointer; transition:transform .02s, background .2s;
      display:flex; align-items:center; gap:8px; min-height:44px;
    }
    button:hover{ background:var(--hsb-blue-700); } button:active{ transform:translateY(1px); }

    .hidden{ display:none !important; }

    @media (max-width: 640px){
      body{ min-height:100dvh; }
      #messages{ padding:12px }
      .message{ max-width:92%; font-size:15px; border-radius:16px }
      .brand-title{ font-size:20px } #topbar{ padding:12px 14px }
      textarea{ min-height:48px; font-size:16px } button{ padding:12px 16px; font-size:16px }
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="chatbox">
      <!-- Topplista -->
      <div id="topbar" role="banner" aria-label="HSB Bostad">
        <div class="brand-title">HSB Bostad</div>
        <div class="brand-sub">kundsupport</div>
      </div>

      <!-- Steg 1 / Steg 2 yta -->
      <nav id="projectSelect" aria-label="Välj ingång">
        <div class="grid" id="entryGrid"><!-- renderas via JS --></div>
      </nav>

      <div id="messages" aria-live="polite" role="log">
        <div class="message bot"><strong>Välkommen till HSB Bostad</strong><br><br>Välj en ingång ovan – t.ex. <em>Sök bostad</em> eller <em>Pågående projekt</em> – så hjälper jag dig vidare. Du kan också skriva din fråga direkt här nedan.</div>
      </div>

      <div id="inputArea">
        <textarea id="userInput" placeholder="Skriv din fråga här..." maxlength="1000" aria-label="chattinmatning"></textarea>
        <span id="charCount" aria-live="polite">0/1000</span>
        <button id="sendBtn" aria-label="skicka fråga" title="skicka (enter)">Skicka</button>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const ENDPOINT = '/.netlify/functions/hsbbostad-gpt';

    const projectSelect = document.getElementById('projectSelect');
    const entryGrid = document.getElementById('entryGrid');
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const charCount = document.getElementById('charCount');

    let history = [];
    let busy = false;
    let selectedProject = null;
    let activePhase = 'pågående';

    // Projektdata (fyll på efterhand)
    const PROJECTS = [
      {
        name:'Ester',
        phase:'pågående',
        city:'Stockholm',
        urls:{
          home:'https://www.hsb.se/sok-bostad/stockholm/stockholm/projekt/ester/',
          prices:'https://www.hsb.se/sok-bostad/stockholm/stockholm/projekt/ester/#project-page__prices-anchor',
          docs:'https://www.hsb.se/sok-bostad/stockholm/stockholm/projekt/ester/#project-page__documents-anchor'
        }
      },
      { name:'Diktafonen', phase:'pågående', city:'Stockholm' },
      { name:'Växeln', phase:'pågående', city:'Bromstensstaden' }
      // { name:'Kornet', phase:'kommande', city:'Haninge' },  // exempel när ni lägger till
    ];

    /* ------------- helpers ------------- */
    const H = {
      el(tag, attrs={}, html){
        const d = document.createElement(tag);
        for(const k in attrs){ if(k==='class') d.className=attrs[k]; else d.setAttribute(k, attrs[k]); }
        if(html!=null) d.innerHTML = html;
        return d;
      }
    };

    function formatForDisplay(t){
      if(!t) return ''; let s = ('' + t).trim();
      s = s.replace(/(^\s*[a-zåäö])|([.!?]\s+[a-zåäö])/g, m => m.toUpperCase());
      s = s.replace(/\bbrf(:?[:\-]?[\wåäö]+)?\b/gi, m => m.toLowerCase());
      return s;
    }
    function addMessage(role, text){
      const div = document.createElement('div');
      div.className = role === 'error' ? 'error' : `message ${role}`;
      if (text == null) {
        div.innerHTML = `<span class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>`;
      } else {
        div.textContent = formatForDisplay(text);
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }
    function showError(msg){ addMessage('error', msg); }
    function autoResize(el){ el.style.height='auto'; el.style.height = Math.min(220, el.scrollHeight) + 'px'; }
    function updateCharCount(el){ if(charCount) charCount.textContent = `${el.value.length}/1000`; }

    // enkel PII-sanerare innan loggning
    function cleanPII(txt=''){
      return String(txt)
        .replace(/\b[A-ZÅÄÖ][a-zåäö]+\s[A-ZÅÄÖ][a-zåäö]+\b/g,'[namn]')
        .replace(/[0-9]{6}-[0-9]{4}/g,'[personnummer]')
        .replace(/\b\d{10}\b/g,'[telefonnummer]')
        .replace(/\b\w+@[^\s]+\b/g,'[epost]')
        .replace(/\d{3}\s?\d{2}\s?\d{2}/g,'[postnummer]');
    }

    async function callApi(body){
      const r = await fetch(ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
      if(!r.ok) throw new Error(`http ${r.status}`);
      return r.json();
    }

    /* ---------- RENDER: Steg 1 (ingångar) ---------- */
    function renderEntries(){
      selectedProject = null;
      activePhase = 'pågående';
      projectSelect.setAttribute('aria-label','Välj ingång');
      projectSelect.innerHTML = '';
      const grid = H.el('div', { class:'grid', id:'entryGridInner' });

      grid.append(
        entryBtn('card card--primary','search', iconSearch(),'Sök bostad','Filtrera på ort, pris, storlek och projektfas'),
        entryBtn('card card--gold','member', iconKey(),'Bli medlem i HSB','Förtur till nyproduktion, bospar och trygghet'),
        entryBtn('card card--primary','ongoing', iconCrane(),'Pågående projekt','Se projekt där du kan köpa nu'),
        entryBtn('card card--gold','upcoming', iconSprout(),'Kommande projekt','Anmäl intresse och få uppdateringar'),
        entryBtn('card card--light','movedin', iconHouse(),'Inflyttade projekt','Färdiga referenser och inspiration'),
        entryBtn('card card--light','about', iconInfo(),'Om HSB Bostad','Trygghet, hållbarhet och kooperativt boende')
      );

      projectSelect.appendChild(grid);
    }

    function entryBtn(cls,data,titleIcon,title,sub){
      const btn = H.el('button',{ class: cls, 'data-entry':data });
      btn.innerHTML = `
        <span class="card-title">${titleIcon} ${title}</span>
        <span class="card-sub">${sub}</span>`;
      btn.addEventListener('click', ()=>handleEntryClick(data));
      btn.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); btn.click(); }});
      return btn;
    }

    /* ---------- RENDER: Steg 2 (projektlista med tillbaka + tabs) ---------- */
    function renderProjects(phase='pågående'){
      activePhase = phase;
      projectSelect.setAttribute('aria-label','Välj projekt');
      projectSelect.innerHTML = '';

      // Backbar + Tabs
      const bar = H.el('div',{ class:'bar' });

      const back = H.el('button',{ class:'backbtn', 'aria-label':'Tillbaka till huvudmeny' },
        `${iconArrowLeft()} Tillbaka`);
      back.addEventListener('click', backToEntries);
      back.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); back.click(); }});
      bar.appendChild(back);

      const tabs = H.el('div',{ class:'tabs', role:'tablist' });
      [['pågående','Pågående'],['kommande','Kommande'],['inflyttade','Inflyttade']].forEach(([key,label],i)=>{
        const t = H.el('button',{ class:'tab', role:'tab', 'data-phase':key, 'aria-selected': key===phase?'true':'false', tabindex: key===phase?'0':'-1' }, label);
        t.addEventListener('click', ()=> switchPhase(key));
        t.addEventListener('keydown', (e)=>{
          const keys=['ArrowRight','ArrowLeft'];
          if(!keys.includes(e.key)) return;
          e.preventDefault();
          const order=['pågående','kommande','inflyttade'];
          let idx = order.indexOf(document.querySelector('.tab[aria-selected="true"]').getAttribute('data-phase'));
          idx = e.key==='ArrowRight' ? (idx+1)%order.length : (idx-1+order.length)%order.length;
          switchPhase(order[idx]);
        });
        tabs.appendChild(t);
      });
      bar.appendChild(tabs);
      projectSelect.appendChild(bar);

      // Grid med filtrerade projekt
      const grid = H.el('div',{ class:'grid', 'data-level':'projects' });
      const filtered = PROJECTS.filter(p => (phase==='inflyttade' ? p.phase==='inflyttade' : p.phase===phase));
      if(filtered.length===0){
        const empty = H.el('div',{ class:'card card--light', role:'status' },
          `<span class="card-title">${iconInfo()} Inga projekt i kategorin</span>
           <span class="card-sub">Välj en annan flik eller skriv vad du söker, så hjälper jag dig.</span>`);
        empty.style.cursor='default';
        grid.appendChild(empty);
      }else{
        filtered.forEach(p=>{
          const btn = H.el('button',{ class:'card card--gold', 'data-projekt':p.name, 'aria-label': `${p.city||''} – ${p.name}`});
          btn.innerHTML = `
            <span class="card-title">${iconHouse()} ${p.city ? `${p.city} – ` : ''}HSB brf ${p.name}</span>
            <span class="card-sub">${capitalize(p.phase)} · Chatta om projektet</span>`;
          btn.addEventListener('click',()=> startProjectIntro(p.name));
          btn.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); btn.click(); }});
          grid.appendChild(btn);
        });
      }
      projectSelect.appendChild(grid);
    }

    function switchPhase(key){
      document.querySelectorAll('.tab').forEach(t=>{
        const active = t.getAttribute('data-phase')===key;
        t.setAttribute('aria-selected', active?'true':'false');
        t.tabIndex = active?0:-1;
      });
      renderProjects(key);
    }
    function backToEntries(){ renderEntries(); }

    /* ---------- Steg 1 klick ---------- */
    function handleEntryClick(entry){
      switch(entry){
        case 'search':
          addMessage('bot',
            'Ska vi hitta en bostad åt dig? Skriv ort, ungefärlig budget och storlek (t.ex. ”Stockholm, max 3,8 Mkr, 3 rok”), så visar jag relevanta projekt och nästa steg.');
          break;
        case 'member':
          addMessage('bot',
            'Som medlem i HSB får du förtur till nyproduktion, kan bospara och får tryggt stöd i boendet. Vill du veta hur du blir medlem och vilka alternativ som passar dig bäst?');
          break;
        case 'ongoing':   renderProjects('pågående');   break;
        case 'upcoming':  renderProjects('kommande');   break;
        case 'movedin':   renderProjects('inflyttade');  break;
        case 'about':
          addMessage('bot',
            'HSB Bostad bygger hållbara hem med fokus på omtanke och trygghet. Vi är en del av HSB – ett kooperativ där medlemsnytta och långsiktighet står i centrum.');
          break;
      }
    }

    /* ---------- Projektstart utan användar-bubbla ---------- */
    async function startProjectIntro(projectName){
      selectedProject = projectName;

      // Visa liten ”header-kort” med valt projekt + tillbaka
      projectSelect.innerHTML = '';
      const bar = H.el('div',{ class:'bar' });
      const back = H.el('button',{ class:'backbtn', 'aria-label':'Tillbaka till projekten' },
        `${iconArrowLeft()} Tillbaka`);
      back.addEventListener('click', ()=> renderProjects(activePhase));
      bar.appendChild(back);
      projectSelect.appendChild(bar);

      const grid = H.el('div',{ class:'grid' });
      const btn = H.el('button',{ class:'card card--primary' });
      btn.innerHTML = `
        <span class="card-title">${iconHouse()} Chatten för HSB brf ${projectName}</span>
        <span class="card-sub">Information och snabb väg till priser, dokument och intresseanmälan</span>`;
      grid.appendChild(btn);
      projectSelect.appendChild(grid);

      // Rensa konversationen
      history = [];
      try { localStorage.removeItem('hsb-chat-history'); } catch {}
      messagesEl.innerHTML = '';

      // Intro + kända länkar
      const thinking = addMessage('bot', null);
      try{
        const proj = PROJECTS.find(p => p.name===projectName) || {};
        const esterLinks =
          proj.name==='Ester' && proj.urls
            ? `\n\nSnabbvägar: Priser → ${proj.urls.prices}\nDokument → ${proj.urls.docs}`
            : '';

        const sys = "du är hsb bostads kundsupport. skriv sakligt och omtänksamt. börja alltid varje mening med stor bokstav. skriv 'brf' och 'brf:er' med gemener. inga emojis.";
        const prompt = [
          { role:'system', content: sys },
          { role:'system', content: `aktuellt_projekt: ${projectName}` },
          { role:'system', content:
            `Skriv en kort introduktion om projektet "${projectName}" på 2–4 meningar (läge, lägenhetstyper/standard, hur man går vidare).
             Avsluta exakt med: "Vad undrar du om ${projectName}? Vad kan jag hjälpa dig med?"` }
        ];
        const data = await callApi({ messages: prompt });
        const text = (data?.choices?.[0]?.message?.content || `Du har öppnat chatten för ${projectName}. Vad undrar du om ${projectName}? Vad kan jag hjälpa dig med?`).trim();

        thinking.remove();
        addMessage('bot', text + esterLinks);
        history.push({ role:'assistant', content: text + esterLinks });

        if (window.hsbLogAssistant) {
          try { await window.hsbLogAssistant(cleanPII(text), { project: projectName, type: 'intro' }); } catch(e){ console.warn('log intro fail', e); }
        }
      }catch(e){
        console.error(e);
        thinking.remove();
        const fallback = `Du har öppnat chatten för ${projectName}. Vad undrar du om ${projectName}? Vad kan jag hjälpa dig med?`;
        addMessage('bot', fallback);
        if (window.hsbLogAssistant) {
          try { await window.hsbLogAssistant(cleanPII(fallback), { project: projectName, type: 'intro' }); } catch(e){}
        }
      }
    }

    /* ---------- Skicka meddelande ---------- */
    async function sendMessage(){
      if(busy) return;
      const raw = (input.value || '').trim();
      if(!raw) return;

      busy = true;
      sendBtn.disabled = true;
      messagesEl.setAttribute('aria-busy','true');

      addMessage('user', raw);
      history.push({ role:'user', content: raw });
      try { localStorage.setItem('hsb-chat-history', JSON.stringify(history)); } catch {}

      if (window.hsbLogUser) {
        try { await window.hsbLogUser(cleanPII(raw)); } catch(e){ console.warn('log user fail', e); }
      }

      input.value = ''; updateCharCount(input); autoResize(input);

      const thinking = addMessage('bot', null);
      try{
        const sys =
          "du är hsb bostads kundsupport. skriv sakligt och omtänksamt. börja alltid varje mening med stor bokstav. skriv 'brf' och 'brf:er' med gemener. inga emojis.";
        const msgs = [{ role:'system', content: sys }];
        if (selectedProject){
          msgs.push({ role:'system',
            content:`aktuellt_projekt: ${selectedProject}\ninstruera: anpassa svar, exempel och hänvisningar till projektet "${selectedProject}".` });
        }
        for(const m of history){ if(m.role !== 'system') msgs.push(m); }

        const data = await callApi({ messages: msgs });
        const svar = (data?.choices?.[0]?.message?.content || 'Kunde inte generera svar.').trim();

        thinking.remove();
        addMessage('bot', svar);
        history.push({ role:'assistant', content: svar });
        try { localStorage.setItem('hsb-chat-history', JSON.stringify(history)); } catch {}

        if (window.hsbLogAssistant) {
          try { await window.hsbLogAssistant(cleanPII(svar), { project: selectedProject || null }); } catch(e){ console.warn('log assistant fail', e); }
        }
      }catch(err){
        console.error(err);
        thinking.remove();
        showError(String(err).includes('http 429') ? 'Många frågor samtidigt – prova igen strax.' : 'Något gick fel, försök igen senare.');
      }finally{
        busy = false;
        sendBtn.disabled = false;
        messagesEl.setAttribute('aria-busy','false');
        input.focus();
      }
    }

    function handleKey(e){
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
      if((e.key === 'Enter' && (e.metaKey || e.ctrlKey))){ e.preventDefault(); input.value += '\n'; autoResize(input); updateCharCount(input); }
    }

    /* ---------- Ikoner ---------- */
    function iconSearch(){ return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.65" y1="16.65" x2="21" y2="21"></line></svg>`;}

    /* ---------- Init ---------- */
    function init(){
      renderEntries();
      if(sendBtn) sendBtn.addEventListener('click', sendMessage);
      if(input){
        input.addEventListener('keydown', handleKey);
        input.addEventListener('input', () => { updateCharCount(input); autoResize(input); });
        updateCharCount(input); autoResize(input);
      }
    }
    init();
  })();
