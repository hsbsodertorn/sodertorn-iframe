<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HSB Bostad – Kundsupport GPT</title>

  <!-- Prestanda för typsnitt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;600;700&family=Open+Sans&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#00558c">

  <!-- Firebase (loggning) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "DIN_FIREBASE_API_KEY",
      authDomain: "hsbbostad-support.firebaseapp.com",
      projectId: "hsbbostad-support",
      storageBucket: "hsbbostad-support.appspot.com",
      messagingSenderId: "000000000000",
      appId: "1:000000000000:web:xxxxxxxxxxxxxxxxxxxxxx",
      measurementId: "G-XXXXXXXXXX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const logQueue = [];
    window.saveChatLog = async (conversationId, fraga, svar) => {
      const logEntry = { conversationId, fraga, svar, tid: serverTimestamp() };
      logQueue.push(logEntry);
      while (logQueue.length > 0) {
        try {
          await addDoc(collection(db, "chattlogg_bostad"), logQueue[0]);
          logQueue.shift();
        } catch (err) {
          console.error("Fel vid loggning i Firebase:", err);
          if (window.showError) window.showError("kunde inte spara chatten. försök igen.");
          break;
        }
      }
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Saira', sans-serif;
      background: #f5f7fa;
      color: #222;
    }
    #wrapper {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fa;
      padding: 24px;
    }
    #chatbox {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
      height: 80vh;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #eaeaea;
      background: #ffffff;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 50%;
      background: #00558c; color: #fff; display: grid; place-items: center;
      font-weight: 700;
    }
    .brand-title { font-weight: 700; }
    .brand-sub { font-size: 12px; opacity: .8; }
    .badge { font-size: 11px; padding: 4px 8px; background:#eef3ff; border-radius: 999px; }

    .header {
      background: #00558c;
      color: #fff;
      text-align: center;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
    }

    #messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }
    .message {
      max-width: 75%;
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 16px;
      white-space: pre-line;
      word-break: break-word;
      font-size: 16px;
      line-height: 1.4;
    }
    .user {
      align-self: flex-end;
      background: #e1ecf4;
      color: #003366;
    }
    .bot, .bot-question {
      align-self: flex-start;
      background: #f0f5ff;
      color: #222;
    }
    .error {
      align-self: center;
      background: #ffe6e6;
      color: #d32f2f;
      padding: 8px 16px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .thinking { display: inline-flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; background-color: #888; border-radius: 50%; animation: blink 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }

    #inputArea {
      display: flex;
      align-items: center;
      padding: 12px;
      border-top: 1px solid #e0e0e0;
      gap: 12px;
      background: #fafafa;
    }
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 200px;
      padding: 14px 20px;
      border-radius: 24px;
      border: 1px solid #ccc;
      font-size: 16px; /* iOS-zoom fix */
      -webkit-text-size-adjust: 100%;
      resize: none;
      font-family: 'Saira', sans-serif;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #00558c; outline: none; }
    #charCount { font-size: 14px; color: #666; min-width: 72px; text-align: right; }
    button {
      background: #00558c;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #004070; }
    button:disabled { opacity: .6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="chatbox">
      <div id="topbar" role="banner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">HSB</div>
          <div>
            <div class="brand-title">HSB Bostad</div>
            <div class="brand-sub">kundsupport</div>
          </div>
        </div>
        <span class="badge" aria-label="HSB grafisk profil">BOSTAD</span>
      </div>

      <div class="header">HSB Bostad – kundsupport</div>

      <div id="messages" aria-live="polite">
        <div class="message bot"><strong>välkommen till hsb bostad</strong>

berätta gärna vilket projekt eller ort det gäller och om du är köpare, boende eller intressent – så hjälper jag dig snabbare.</div>
      </div>

      <div id="inputArea">
        <textarea id="userInput" placeholder="skriv din fråga här…" maxlength="1000" autocomplete="off"
          oninput="autoResize(this); updateCharCount(this)" onkeydown="handleKey(event)" aria-label="skriv din fråga"></textarea>
        <span id="charCount">0/1000</span>
        <button id="sendBtn" onclick="sendMessage()" aria-label="skicka fråga">skicka</button>
      </div>
    </div>
  </div>

  <!-- Chat-logik -->
  <script>
    // 1) konversation + strikt systemprompt (klient)
    const conversationId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    const messages = [
      { role: "system", content: "du är hsb bostads kundsupport. skriv sakligt och omtänksamt. använd aldrig versaler på enstaka ord eller hela meningar. börja bara nya meningar med versal. skriv 'brf' och 'brf:er' med gemener. använd exempel från huddinge, botkyrka, tullinge, nynäshamn, visby och hemse där det passar. inga emojis." }
    ];

    function addMessage(role, text) {
      const container = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = role === "error" ? "error" : `message ${role}`;
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    function showError(msg) { addMessage("error", msg); }
    window.showError = showError; // så firebase-scriptet kan anropa

    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    }
    function updateCharCount(el) {
      document.getElementById("charCount").textContent = `${el.value.length}/1000`;
    }
    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // 2) disable-knapp/spam-skydd
    let busy = false;

    // 3) retry med backoff
    async function callApi(body, tries = 2, delay = 800) {
      try {
        const r = await fetch("/.netlify/functions/hsbbostad-gpt", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!r.ok) throw new Error(`http ${r.status}`);
        return await r.json();
      } catch (e) {
        if (tries > 0) {
          await new Promise(res => setTimeout(res, delay));
          return callApi(body, tries - 1, delay * 2);
        }
        throw e;
      }
    }

    // post-process: säkerställ skrivregler
    function normalizeCase(text) {
      if (!text) return text;

      // allt till gemener
      let t = text.toLowerCase();

      // kapitalisera meningsbörjan (svensk a/å/ä/ö)
      t = t.replace(/(^\s*[a-zåäö])|([.!?]\s+[a-zåäö])/g, m => m.toUpperCase());

      // varumärken/akronymer som ska vara versaler
      t = t.replace(/\bhsb\b/g, "HSB");

      // skrivregler för brf
      t = t.replace(/\bbrf:er\b/gi, "brf:er");
      t = t.replace(/\bbrf\b/gi, "brf");

      return t;
    }

    async function sendMessage() {
      if (busy) return;

      const btn = document.getElementById("sendBtn");
      const input = document.getElementById("userInput");
      const list = document.getElementById("messages");
      const text = (input.value || "").trim();
      if (!text) return;

      busy = true;
      btn.disabled = true;
      list.setAttribute("aria-busy", "true");

      // visa användarens fråga
      addMessage("user", text);
      input.value = "";
      updateCharCount(input);
      autoResize(input);

      // visa "tänker..."
      const thinking = addMessage("bot", "...");
      thinking.innerHTML = `<span class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>`;

      try {
        messages.push({ role: "user", content: text });

        // 1) skicka hela kontexten
        const data = await callApi({ messages });

        let svar = data?.choices?.[0]?.message?.content?.trim() || "kunde inte generera svar.";
        svar = normalizeCase(svar); // 4) tvinga rätt stil innan visning

        thinking.remove();
        addMessage("bot", svar);

        messages.push({ role: "assistant", content: svar });

        // logga till firebase (tyst vid fel)
        if (window.saveChatLog) {
          try { await window.saveChatLog(conversationId, text, svar); } catch(e) {}
        }
      } catch (err) {
        console.error(err);
        thinking.remove();
        const msg = String(err).includes("http 429")
          ? "många frågor samtidigt – prova igen strax."
          : "något gick fel, försök igen senare.";
        showError(msg);
      } finally {
        busy = false;
        btn.disabled = false;
        list.setAttribute("aria-busy", "false");
        input.focus();
      }
    }
  </script>
</body>
</html>
