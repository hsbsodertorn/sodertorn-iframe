<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>HSB Bostad – kundsupport GPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    :root{
      --hsb-blue-1:#003366;
      --hsb-blue-700:#00264d;
      --hsb-blue-5:#CBE8F1;
      --vh: 1vh;
      --radius:16px;
      --user-bg:#f7f7f8;
      --bot-bg:#e8f0fe;
      --error:#b91c1c;
      --error-bg:#ffe6e6;
    }

    *, *::before, *::after { box-sizing:border-box; }
    html, body {
      height: 100%;
      margin: 0; padding: 0;
      overflow: auto;
      background:#fff; color:#0e1012;
      font-family:'Open Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    #wrapper{
      height: calc(var(--vh) * 100);
      min-height: 100dvh;
      width:100%;
      display:flex;
      background:#fff;
      border:2px solid var(--hsb-blue-1);
      border-radius:var(--radius);
      overflow:hidden;
    }
    #chatbox{ display:flex; flex-direction:column; width:100%; height:100%; }

    #topbar{
      display:flex; align-items:center; gap:12px;
      padding:14px 16px;
      background:var(--hsb-blue-1); color:#fff;
      border-bottom:1px solid rgba(255,255,255,.15);
      flex-shrink:0;
    }
    .brand-title{ font-weight:700; font-size:22px; color:#fff; }
    .brand-sub{ display:none !important; }

    #messages{
      flex:1; min-height:0;
      padding:16px;
      overflow:auto;
      display:flex; flex-direction:column; gap:12px;
      background:#fff;
    }
    .message{
      max-width:75%;
      padding:12px 16px;
      border-radius:20px;
      white-space:pre-line; word-break:break-word;
      font-size:16px; line-height:1.45;
      border:1px solid rgba(0,0,0,.06);
      display:inline-block;
    }
    .user{ align-self:flex-end; background:var(--user-bg); color:#000; }
    .bot{ align-self:flex-start; background:var(--bot-bg); color:#000; }
    .error{ align-self:center; background:var(--error-bg); color:var(--error); border:1px solid #fecaca; padding:10px 14px; border-radius:12px; }

    @media (max-width: 600px){
      #messages{ padding:12px }
      .message{ max-width:96%; font-size:15px; border-radius:16px }
      .brand-title{ font-size:20px }
      #topbar{ padding:12px 14px }
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div id="chatbox">
      <div id="topbar" role="banner" aria-label="HSB Bostad">
        <div class="brand-title">HSB Bostad</div>
      </div>

      <div id="messages" aria-live="polite" role="log">
        <div class="message bot"><strong>Välkommen till HSB Bostad</strong><br><br>Ställ din fråga här i chatten – jag hjälper dig med projekt, utbud, bospar och kontaktvägar utan att du behöver lämna sidan.</div>
      </div>
    </div>
  </div>
</body>
</html>
